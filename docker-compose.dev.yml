# Local dev infra only — MongoDB + Redis. Run the three apps themselves via
# `npm run dev:api` / `dev:web` / `dev:admin` in separate terminals.
#
#   docker compose -f docker-compose.dev.yml up -d
#
services:
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - kw_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  kw_mongo_data:
